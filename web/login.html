<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7eaf3">
  <link rel="icon" href="data:,">
  <title>Clearing Desk</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
  <main class="login">
    <h1>Clearing Desk</h1>
    <p>Invoice to payment decision, with every step visible.</p>
    <form id="loginForm">
      <label for="code">Access code</label>
      <input id="code" name="code" type="password" autocomplete="current-password" spellcheck="false" required autofocus>
      <p id="loginError" role="alert"></p>
      <button class="run" id="loginButton" type="submit">Open the desk</button>
    </form>
  </main>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = document.getElementById("loginButton"), error = document.getElementById("loginError");
      button.disabled = true;
      button.textContent = "Checking…";
      error.textContent = "";
      try {
        const response = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: document.getElementById("code").value }) });
        if (response.ok) return location.replace("/");
        error.textContent = response.status === 401 ? "That access code is not correct." : "Sign-in failed. Try again.";
      } catch {
        error.textContent = "The desk could not be reached. Check your connection and try again.";
      }
      button.disabled = false;
      button.textContent = "Open the desk";
    });
  </script>
</body>
</html>
